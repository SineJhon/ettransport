<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to ET Transport">
    <title>Login | ET Transport</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.svg">
</head>
<body data-auth-guest-only="1">
    <header class="site-header">
        <nav class="navbar container">
            <a href="index.html" class="logo" aria-label="ET Transport home">
                <span class="logo-icon" aria-hidden="true">&#128652;</span>
                <span class="logo-text">ET<span>Transport</span></span>
            </a>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="search.html">Search</a></li>
                <li><a href="companies.html">Companies</a></li>
            </ul>
            <div class="nav-actions">
                <a href="register.html" class="btn btn-login">Register</a>
            </div>
            <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
                <span class="bar"></span><span class="bar"></span><span class="bar"></span>
            </button>
        </nav>
    </header>

    <main class="container" style="max-width: 640px; padding-top: 2rem; padding-bottom: 2rem;">
        <section class="search-card" aria-labelledby="login-title">
            <h1 id="login-title">Login</h1>
            <p>Access your passenger, company, or admin account.</p>

            <div id="auth-message" class="auth-message" hidden></div>

            <form id="login-form" novalidate>
                <label for="login-email">Email</label>
                <input id="login-email" name="email" type="email" required autocomplete="email" placeholder="you@example.com">

                <label for="login-password">Password</label>
                <input id="login-password" name="password" type="password" required autocomplete="current-password" placeholder="Your password">

                <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Login</button>
            </form>

            <p style="margin-top: 1rem;">No account yet? <a href="register.html">Create one</a>.</p>
        </section>
    </main>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
