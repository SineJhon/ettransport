<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register on ET Transport">
    <title>Register | ET Transport</title>
    <link rel="stylesheet" href="css/style.css?v=20260911-field-errors">
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.svg">
</head>
<body data-auth-guest-only="1">
    <header class="site-header">
        <nav class="navbar container">
            <a href="index.html" class="logo" aria-label="ET Transport home">
                <span class="logo-icon" aria-hidden="true">&#128652;</span>
                <span class="logo-text">ET<span>Transport</span></span>
            </a>
            <div class="nav-actions">
                <a href="login.html" class="btn btn-login">Login</a>
            </div>
        </nav>
    </header>

    <main class="container" style="max-width: 760px; padding-top: 2rem; padding-bottom: 2rem;">
        <section class="search-card" aria-labelledby="register-title">
            <h1 id="register-title">Create Account</h1>
            <p>Register as a passenger or company account. Company accounts require admin approval.</p>

            <div id="auth-message" class="auth-message" hidden></div>

            <form id="register-form" novalidate>
                <label for="register-role">Account Type</label>
                <select id="register-role" name="role" required>
                    <option value="passenger">Passenger</option>
                    <option value="company">Company</option>
                </select>

                <label for="register-name">Full Name / Contact Person</label>
                <input id="register-name" name="name" type="text" required autocomplete="name" placeholder="Full name">
                <p id="register-name-error" class="field-error" hidden role="alert"></p>

                <label for="register-email">Email</label>
                <input id="register-email" name="email" type="email" required autocomplete="email" placeholder="you@example.com">
                <p id="register-email-error" class="field-error" hidden role="alert"></p>

                <label for="register-phone">Phone</label>
                <div class="phone-field">
                    <span class="phone-prefix" aria-hidden="true">+251</span>
                    <input id="register-phone" name="phone" type="tel" class="field-input" required maxlength="9" minlength="9" inputmode="numeric" autocomplete="tel-national" pattern="[179][0-9]{8}" title="9-digit local number after +251 — starts with 7, 9, or 1" placeholder="7/9XXXXXXXX or 11XXXXXXX">
                </div>
                <div id="register-phone-info" class="phone-info" aria-live="polite"></div>
                <p id="register-phone-error" class="field-error" hidden role="alert"></p>

                <label for="register-password">Password</label>
                <div class="password-field">
                    <input id="register-password" name="password" type="password" required autocomplete="new-password" placeholder="Create a password">
                    <button class="password-toggle" type="button" aria-controls="register-password" aria-pressed="false" aria-label="Show password">
                        <svg class="password-toggle-icon password-toggle-icon--show" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.75"/></svg>
                        <svg class="password-toggle-icon password-toggle-icon--hide" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.2A10.8 10.8 0 0 1 12 6c6.1 0 9.5 6 9.5 6a18.2 18.2 0 0 1-3.3 3.8M6.1 6.1A18.5 18.5 0 0 0 2.5 12S5.9 18 12 18c1.3 0 2.5-.3 3.5-.7"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                        <span class="sr-only">Show password</span>
                    </button>
                </div>
                <ul id="register-pw-reqs" class="pw-reqs" aria-label="Password requirements">
                    <li data-pw-req="length">At least 6 characters</li>
                    <li data-pw-req="letter">At least one letter</li>
                    <li data-pw-req="number">At least one number</li>
                </ul>
                <p id="register-password-error" class="field-error" hidden role="alert"></p>

                <label for="register-confirm">Confirm Password</label>
                <div class="password-field">
                    <input id="register-confirm" name="password_confirmation" type="password" required autocomplete="new-password" placeholder="Re-enter your password">
                    <button class="password-toggle" type="button" aria-controls="register-confirm" aria-pressed="false" aria-label="Show password">
                        <svg class="password-toggle-icon password-toggle-icon--show" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.75"/></svg>
                        <svg class="password-toggle-icon password-toggle-icon--hide" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.2A10.8 10.8 0 0 1 12 6c6.1 0 9.5 6 9.5 6a18.2 18.2 0 0 1-3.3 3.8M6.1 6.1A18.5 18.5 0 0 0 2.5 12S5.9 18 12 18c1.3 0 2.5-.3 3.5-.7"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                        <span class="sr-only">Show password</span>
                    </button>
                </div>

                <p id="register-confirm-hint" class="field-hint" data-default="Passwords must match.">Passwords must match.</p>
                <div id="company-fields" hidden>
                    <label for="company-name">Company Name</label>
                    <input id="company-name" name="company_name" type="text" data-company-required="1" placeholder="Company legal name">
                    <p id="company-name-error" class="field-error" hidden role="alert"></p>

                    <label for="company-address">Company Address</label>
                    <input id="company-address" name="company_address" type="text" data-company-required="1" placeholder="City, sub-city, area">
                    <p id="company-address-error" class="field-error" hidden role="alert"></p>

                    <label for="company-description">Company Description (optional)</label>
                    <textarea id="company-description" name="company_description" rows="3" placeholder="Short company profile"></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Register</button>
            </form>

            <p style="margin-top: 1rem;">Already registered? <a href="login.html">Login</a>.</p>
        </section>
    </main>

    <script src="js/main.js"></script>
    <script src="js/auth.js?v=20260911-field-errors"></script>
</body>
</html>
