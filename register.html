<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register on ET Transport">
    <title>Register | ET Transport</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.svg">
</head>
<body data-auth-guest-only="1">
    <header class="site-header">
        <nav class="navbar container">
            <a href="index.html" class="logo" aria-label="ET Transport home">
                <span class="logo-icon" aria-hidden="true">&#128652;</span>
                <span class="logo-text">ET<span>Transport</span></span>
            </a>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="search.html">Search</a></li>
                <li><a href="companies.html">Companies</a></li>
            </ul>
            <div class="nav-actions">
                <a href="login.html" class="btn btn-login">Login</a>
            </div>
            <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
                <span class="bar"></span><span class="bar"></span><span class="bar"></span>
            </button>
        </nav>
    </header>

    <main class="container" style="max-width: 760px; padding-top: 2rem; padding-bottom: 2rem;">
        <section class="search-card" aria-labelledby="register-title">
            <h1 id="register-title">Create Account</h1>
            <p>Register as a passenger or company account. Company accounts require admin approval.</p>

            <div id="auth-message" class="auth-message" hidden></div>

            <form id="register-form" novalidate>
                <label for="register-role">Account Type</label>
                <select id="register-role" name="role" required>
                    <option value="passenger">Passenger</option>
                    <option value="company">Company</option>
                </select>

                <label for="register-name">Full Name / Contact Person</label>
                <input id="register-name" name="name" type="text" required autocomplete="name" placeholder="Full name">

                <label for="register-email">Email</label>
                <input id="register-email" name="email" type="email" required autocomplete="email" placeholder="you@example.com">

                <label for="register-phone">Phone</label>
                <input id="register-phone" name="phone" type="tel" required autocomplete="tel" placeholder="+2519XXXXXXXX">

                <label for="register-password">Password</label>
                <input id="register-password" name="password" type="password" required autocomplete="new-password" placeholder="At least 8 chars with letters and numbers">

                <label for="register-confirm">Confirm Password</label>
                <input id="register-confirm" name="password_confirmation" type="password" required autocomplete="new-password" placeholder="Re-enter your password">

                <div id="company-fields" hidden>
                    <label for="company-name">Company Name</label>
                    <input id="company-name" name="company_name" type="text" data-company-required="1" placeholder="Company legal name">

                    <label for="company-address">Company Address</label>
                    <input id="company-address" name="company_address" type="text" data-company-required="1" placeholder="City, sub-city, area">

                    <label for="company-description">Company Description (optional)</label>
                    <textarea id="company-description" name="company_description" rows="3" placeholder="Short company profile"></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Register</button>
            </form>

            <p style="margin-top: 1rem;">Already registered? <a href="login.html">Login</a>.</p>
        </section>
    </main>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
